[project]
name = "astrbot-plugin-booth-push"
version = "0.2.0"
description = "Direct Booth daily crawl and push plugin for AstrBot"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
